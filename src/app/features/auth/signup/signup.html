
<div class="auth-page">
  <div class="auth-container">

    <div class="auth-heading">
      <span class="eyebrow">CREATE YOUR ACCOUNT</span>

      <h1>Get started with DAP.</h1>

      <p>
        Create your account to explore vehicle pricing
        and understand your drive away price.
      </p>
    </div>

    <div class="auth-card">

      @if (errorMessage) {
        <div class="message error" role="alert">
          {{ errorMessage }}
        </div>
      }

      @if (successMessage) {
        <div class="message success" role="status">
          {{ successMessage }}
        </div>
      }

      <form (ngSubmit)="onSignup()" #signupForm="ngForm">

        <div class="form-group">
          <label for="fullName">Full name <span>*</span></label>

          <input
            id="fullName"
            type="text"
            name="fullName"
            [(ngModel)]="fullName"
            placeholder="Enter your full name"
            required
            minlength="2"
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label for="email">Email address <span>*</span></label>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="you@example.com"
            required
            email
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password <span>*</span></label>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Minimum 8 characters"
            required
            minlength="8"
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password <span>*</span></label>

          <input
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Re-enter your password"
            required
            autocomplete="new-password"
          />
        </div>

        <button
          type="submit"
          class="submit-button"
          [disabled]="loading || signupForm.invalid"
        >
          @if (loading) {
            Creating account...
          } @else {
            Create account <span>→</span>
          }
        </button>

      </form>

      <div class="auth-switch">
        <span>Already have an account?</span>
        <a routerLink="/login">Sign in →</a>
      </div>

    </div>

    <p class="footer-note">
      DRIVE AWAY PRICE · DAP
    </p>

  </div>
</div>
